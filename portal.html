<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پورتال مشتریان</title>
<style>
@font-face { font-family: "Vazirmatn"; src: url("invoice/Vazirmatn.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root { --bg:#f4f5f9; --card:#fff; --tx:#141922; --mu:#667085; --ln:#e4e7ec; --pr:#4f46e5; --pr-h:#4338ca; --on:#fff; --pr-s:#eef0ff; --ok:#059669; --ok-s:#e6f6ef;
  --wa:#d97706; --wa-s:#fdf3e1; --er:#dc2626; --er-s:#fdecec; --in:#0891b2; --in-s:#e3f5f9; --s2:#f5f6f9; --s3:#eceff4; --r:16px; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#12141b; --card:#181b24; --tx:#eceff5; --mu:#98a2b3; --ln:#2e3445; --pr:#8b93ff; --pr-h:#a5abff; --on:#10123a; --pr-s:#262a52;
  --ok:#34d399; --ok-s:#173a2e; --wa:#fbbf24; --wa-s:#3a2d12; --er:#f87171; --er-s:#3d1b1b; --in:#22d3ee; --in-s:#123540; --s2:#1f2330; --s3:#282d3d; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--tx); font: 14px/1.75 Vazirmatn, "Segoe UI", Tahoma, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4, p { margin: 0; }
.mu { color: var(--mu); } .sm { font-size: 12.5px; }
.dg { border: 1px solid var(--bd, #d9dde6); border-radius: 12px; margin: 0 0 10px; padding: 8px 12px; } .dg summary { cursor: pointer; font-weight: 600; } .dg.bad summary { color: var(--er); } .dg.ok summary { color: var(--ok); } .dg pre { white-space: pre-wrap; word-break: break-all; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; text-align: left; margin: 8px 0 0; user-select: all; }
.boot { max-width: 640px; margin: 20vh auto; padding: 16px; }
/* controls */
.btn { min-height: 42px; padding: 0 20px; border-radius: 12px; border: 1px solid var(--ln); background: var(--card); font-weight: 700; transition: background .15s, transform .05s; }
.btn:hover { background: var(--s3); } .btn:active { transform: translateY(1px); }
.btn.pri { background: var(--pr); border-color: var(--pr); color: var(--on); } .btn.pri:hover { background: var(--pr-h); }
.btn.wide { width: 100%; } .btn:disabled { opacity: .55; cursor: default; }
.lnk { border: 0; background: none; color: var(--pr); font-weight: 700; padding: 4px 8px; border-radius: 8px; } .lnk:hover { background: var(--pr-s); } .lnk:disabled { color: var(--mu); background: none; cursor: default; }
.btn:focus-visible, .lnk:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, .it:focus-visible, .stat:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--pr) 35%, transparent); }
label.f { display: block; margin-bottom: 14px; } label.f > span { display: block; margin-bottom: 6px; font-weight: 700; font-size: 13px; }
input[type=text], input[type=search], textarea, select { width: 100%; min-height: 44px; padding: 10px 14px; border: 1px solid var(--ln); border-radius: 12px; background: var(--card); }
textarea { resize: vertical; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--pr); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pr) 28%, transparent); }
input.otp { text-align: center; letter-spacing: .5em; font-size: 22px; font-weight: 800; }
.msg { padding: 10px 14px; border-radius: 12px; margin: 0 0 14px; font-size: 13px; }
.msg.err { background: var(--er-s); color: var(--er); } .msg.warn { background: var(--wa-s); color: var(--wa); } .msg.ok { background: var(--ok-s); color: var(--ok); } .msg.info { background: var(--in-s); color: var(--in); }
.row { display: flex; justify-content: space-between; align-items: center; margin: -4px 0 12px; }
.bd { display: inline-block; padding: 1px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--s3); color: var(--mu); }
.bd.open { background: var(--pr-s); color: var(--pr); } .bd.won { background: var(--ok-s); color: var(--ok); } .bd.lost { background: var(--er-s); color: var(--er); } .bd.info { background: var(--in-s); color: var(--in); }
.logo { width: 46px; height: 46px; border-radius: 15px; color: #fff; display: grid; place-items: center; font-weight: 900; background: linear-gradient(135deg, #6366f1, #4338ca 60%, #312e81); box-shadow: 0 8px 20px -6px rgba(79,70,229,.55); }
.ico { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; background: var(--s3); color: var(--mu); margin: 0 auto 10px; }
.ico.info { background: var(--ok-s); color: var(--ok); } .ico.warn { background: var(--wa-s); color: var(--wa); }
/* auth */
.auth { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
.auth-side { padding: 56px 48px; color: #fff; display: flex; flex-direction: column; justify-content: center; gap: 14px; background: linear-gradient(150deg, #4f46e5, #312e81 70%); }
.auth-side h1 { font-size: 28px; } .auth-side p { opacity: .85; } .auth-side ul { margin: 6px 0 0; padding: 0 18px 0 0; opacity: .9; } .auth-side .logo { background: rgba(255,255,255,.18); box-shadow: none; }
.auth-main { padding: 40px 32px; display: flex; flex-direction: column; justify-content: center; max-width: 460px; width: 100%; margin: 0 auto; }
.auth-main h2 { font-size: 21px; margin: 14px 0 4px; } .auth-main > p, .auth-main .mu { margin-bottom: 16px; }
.center { text-align: center; }
.seg { display: flex; gap: 4px; padding: 5px; background: var(--s3); border-radius: 14px; margin-bottom: 10px; } .seg .seg-in { display: flex; gap: 4px; width: 100%; }
.seg button { flex: 1; border: 0; border-radius: 10px; padding: 9px; background: none; color: var(--mu); font-weight: 700; }
.seg button[aria-selected="true"] { background: var(--card); color: var(--pr); box-shadow: 0 1px 3px rgba(16,24,40,.12); } .seg.sm button { padding: 5px; font-size: 13px; }
/* shell */
.shell { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; background: var(--card); border-inline-end: 1px solid var(--ln); padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 6px; } .brand small { display: block; color: var(--mu); font-size: 12px; line-height: 1.3; }
.side nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.side nav a, .tabbar a { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; color: var(--mu); text-decoration: none; font-weight: 700; }
.side nav a:hover { background: var(--s2); color: var(--tx); } .side nav a.on { background: var(--pr-s); color: var(--pr); } .side nav a i, .tabbar i { font-style: normal; width: 20px; text-align: center; }
.me { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--ln); border-radius: 14px; } .av { width: 38px; height: 38px; border-radius: 50%; background: var(--pr-s); color: var(--pr); display: grid; place-items: center; font-weight: 800; flex: none; }
.mt { flex: 1; min-width: 0; } .mt b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .mt small { color: var(--mu); }
main { padding: 26px 32px 60px; max-width: 1100px; width: 100%; } main .top { display: none; }
.tabbar { display: none; }
.hero { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; } .hero h1 { font-size: 22px; } .acts { display: flex; gap: 8px; }
.card { background: var(--card); border: 1px solid var(--ln); border-radius: var(--r); padding: 18px 20px; box-shadow: 0 1px 2px rgba(16,24,40,.05); margin-bottom: 16px; }
.card.list { padding: 6px; } .ch { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; } .ch h3 { font-size: 15.5px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } .grid2 > .card { margin-bottom: 0; } .grid2.top { align-items: start; } .grid2 { margin-bottom: 16px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
.stat { text-align: start; border: 1px solid var(--ln); background: var(--card); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 2px; position: relative; overflow: hidden; transition: transform .15s, box-shadow .15s; }
.stat:hover { transform: translateY(-2px); box-shadow: 0 8px 20px -10px rgba(16,24,40,.25); } .stat::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 4px; background: var(--c, var(--pr)); }
.stat.ok { --c: var(--ok); } .stat.wa { --c: var(--wa); } .stat.in { --c: var(--in); } .stat.mu { --c: var(--mu); } .stat .k { color: var(--mu); font-weight: 700; font-size: 13px; } .stat b { font-size: 28px; line-height: 1.3; } .stat small { color: var(--mu); }
.it { width: 100%; display: flex; align-items: center; gap: 12px; text-align: start; padding: 11px 12px; border: 0; border-radius: 12px; background: none; } .it:hover:not(.static) { background: var(--s2); } .it.static { cursor: default; }
.it .t { flex: 1; min-width: 0; display: flex; flex-direction: column; } .it .t b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .it small { color: var(--mu); } .amt { font-weight: 800; color: var(--tx); white-space: nowrap; }
.empty { text-align: center; padding: 22px 10px; color: var(--mu); } .empty .ico { width: 44px; height: 44px; font-size: 18px; }
.bar2 { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; } .bar2 input { flex: 1; min-width: 200px; }
.chips { display: flex; gap: 6px; } .chips button { border: 1px solid var(--ln); background: var(--card); border-radius: 99px; padding: 6px 16px; font-weight: 700; color: var(--mu); } .chips button[aria-pressed="true"] { background: var(--pr); color: var(--on); border-color: var(--pr); }
.tl { list-style: none; margin: 0; padding: 0; } .tl li { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px dashed var(--ln); } .tl li:last-child { border: 0; } .tl li > div { flex: 1; min-width: 0; } .tl b { display: block; } .tl small { color: var(--mu); }
.tl i { width: 10px; height: 10px; border-radius: 50%; background: var(--mu); flex: none; } .tl i.open { background: var(--pr); } .tl i.won { background: var(--ok); } .tl i.lost { background: var(--er); }
.smart { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.ring { --p: 0; width: 104px; height: 104px; border-radius: 50%; display: grid; place-content: center; text-align: center; background: radial-gradient(closest-side, var(--card) 76%, transparent 78%), conic-gradient(var(--pr) calc(var(--p) * 1%), var(--s3) 0); } .ring b { font-size: 22px; line-height: 1.2; } .ring small { color: var(--mu); font-size: 11px; } .ring.sm { margin: 14px auto 0; }
.tips { margin: 0; padding: 0 18px 0 0; color: var(--mu); } .tips li { margin-bottom: 4px; }
.kv { margin: 0; display: grid; gap: 2px; } .kv > div { display: flex; justify-content: space-between; gap: 14px; padding: 8px 0; border-bottom: 1px dashed var(--ln); } .kv dt { color: var(--mu); } .kv dd { margin: 0; font-weight: 700; text-align: end; }
.desc { margin-top: 14px; } .desc h4 { margin-bottom: 4px; color: var(--mu); }
.rof { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--ln); } .rof span { color: var(--mu); }
.note { background: var(--s2); border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; max-width: 92%; } .note.me { background: var(--pr-s); margin-inline-start: auto; } .nh { display: flex; justify-content: space-between; gap: 12px; } .nh small, .ns { color: var(--mu); font-size: 12px; }
.reply { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.tbl { overflow-x: auto; } table { width: 100%; border-collapse: collapse; } th, td { text-align: start; padding: 9px 10px; border-bottom: 1px solid var(--ln); } th { color: var(--mu); font-size: 12.5px; }
.back { margin-bottom: 6px; }
.skel { display: grid; gap: 14px; } .skel i { height: 90px; border-radius: var(--r); background: linear-gradient(90deg, var(--s3), var(--s2), var(--s3)); background-size: 200% 100%; animation: sk 1.2s infinite; } @keyframes sk { to { background-position: -200% 0; } }
#modal[hidden] { display: none; } .ov { position: fixed; inset: 0; background: rgba(10,12,20,.5); z-index: 50; } .dlg { position: fixed; z-index: 51; inset-inline: 0; top: 10vh; margin: 0 auto; width: min(520px, calc(100% - 24px)); background: var(--card); border-radius: 20px; padding: 20px 22px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.5); } .dlg .acts { justify-content: flex-end; }
@media (max-width: 860px) {
  .auth { grid-template-columns: 1fr; } .auth-side { display: none; }
  .shell { grid-template-columns: 1fr; } .side { display: none; }
  main { padding: 14px 14px 90px; } main .top { display: flex; justify-content: flex-end; }
  .stats { grid-template-columns: 1fr 1fr; } .grid2 { grid-template-columns: 1fr; }
  .tabbar { display: flex; position: fixed; inset-inline: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--ln); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .tabbar a { flex: 1; flex-direction: column; gap: 0; padding: 4px; font-size: 11px; justify-content: center; text-align: center; } .tabbar a.on { color: var(--pr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app"><div class="boot"><div class="skel"><i></i><i></i></div></div></div>
<script src="portal/portal.js"></script>
</body>
</html>
